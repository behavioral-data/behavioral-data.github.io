name: Check maintenance health
on:
  workflow_dispatch:
  schedule:
    - cron: '43 16 * * *'
permissions:
  actions: read
  contents: read
  pull-requests: read
jobs:
  health:
    if: vars.WEBSITE_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/monitor.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
