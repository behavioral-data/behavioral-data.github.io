# Manual until the lab approves switching production to React.
# After the first approved deployment, add a push trigger for master if desired.
name: Deploy React website
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: npm run check
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: out
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
