name: Check website
on:
  pull_request:
  push:
    branches: ["codex/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run test:skeleton
      - uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: out
