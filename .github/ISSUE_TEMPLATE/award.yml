name: Award or news
description: Submit an award or lab update with a source
title: "[News] "
body:
  - type: input
    id: title
    attributes:
      label: Exact award name or update
    validations:
      required: true
  - type: input
    id: recipients
    attributes:
      label: Recipients or related lab members
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Awarding organization, linked paper, and details
      description: Public information only. New wording requires editorial review.
